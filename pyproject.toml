[project]
name = "cpa-usage-keeper"
version = "0.1.3"
description = "CPA usage persistence and visualization service"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["cpa", "claude", "usage", "ai", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/8DE4732A/cpa-usage-keeper"
Repository = "https://github.com/8DE4732A/cpa-usage-keeper"
Issues = "https://github.com/8DE4732A/cpa-usage-keeper/issues"

[project.scripts]
cpa-usage-keeper = "cpa_usage_keeper.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpa_usage_keeper"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "cpa_usage_keeper/static"
