[app]
# HTTP 服务监听端口。必填：否。默认值：8080。
port = "8080"
# 留空表示部署在根路径 /；如需部署到子路径，必须以 / 开头，例如 /cpa。
base_path = ""
# 项目业务时区，影响 Today、按天聚合、每日 03:00 清理和日志时间。
timezone = "Asia/Shanghai"

[cpa]
# CPA 服务基础地址。必填：是。默认值：无。
base_url = "http://127.0.0.1:8317"
# CPA management key，用于拉取管理接口数据。必填：是。默认值：无。
management_key = "replace-with-your-management-key"
# 请求 CPA 接口时的超时时间。必填：否。默认值：30s。
request_timeout = "30s"

[sync]
# usage 同步模式：auto / redis / legacy_export
mode = "auto"
# legacy_export 的拉取间隔。必填：否。默认值：5m。
poll_interval = "5m"

[redis]
# CPA management data stream 的 Redis/RESP TCP 地址。留空时默认使用 CPA_BASE_URL 的主机名加 8317 端口。
queue_addr = ""
# 每次 Redis LPOP 最多拉取的队列记录数。
queue_batch_size = 1000
# Redis 队列为空时的 idle 检查间隔。
queue_idle_interval = "1s"

[storage]
# 应用工作目录，SQLite 数据库、日志和备份默认都写入这里。
work_dir = "./data"
# 是否启用 SQLite 数据库备份。必填：否。默认值：true。
backup_enabled = true
# 数据库备份间隔。必填：否。默认值：24h。
backup_interval = "24h"
# 备份文件保留天数。必填：否。默认值：7。
backup_retention_days = 7

[log]
# 应用日志级别。必填：否。默认值：info。
level = "info"
# 是否写入持久化日志文件。必填：否。默认值：true。
file_enabled = true
# 日志文件保留天数；0 表示不自动清理。必填：否。默认值：7。
retention_days = 7

[auth]
# 是否启用登录保护。必填：否。默认值：false。
enabled = false
# 登录密码；仅在启用登录保护时必填。默认值：无。
password = ""
# 登录 session 的有效时长。必填：否。默认值：168h。
session_ttl = "168h"
